name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install quality tools
        run: python -m pip install ruff tox
      - name: Lint
        run: ruff check deadcodex tests
      - name: Check formatting
        run: ruff format --check deadcodex tests
      - name: Test installed wheel
        run: tox -e py
